name: nsbm-student-dev

services:
  web:
    build: .
    ports:
      - "127.0.0.1:8086:80"
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      DB_NAME: "${DB_NAME:-nsbm_sports_db}"
      DB_USER: "${DB_USER:-sportshub_app}"
      DB_PASSWORD: "${DB_PASSWORD:-}"

  db:
    image: mysql:8.4
    profiles: [local-db]
    environment:
      MYSQL_DATABASE: "${DB_NAME:-nsbm_sports_db}"
      MYSQL_USER: "${DB_USER:-sportshub_app}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_ROOT_HOST: localhost
    volumes:
      - sportshub_db_data:/var/lib/mysql
      - ./database/nsbm_sports_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -Nse 'SELECT COUNT(*) FROM sports_clubs' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  sportshub_db_data:
